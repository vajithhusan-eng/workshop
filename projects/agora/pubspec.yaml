name: agora
description: "Agora — Multi-AI Council Orchestrator. Native Linux desktop app that lets a leader AI invite and debate with other real AI agents running in your own logged-in Chrome."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^2.5.1

  # --- Chrome DevTools Protocol transport (talks to system Chrome over WS) ---
  web_socket_channel: ^3.0.3

  # --- Local storage ---
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # --- Utilities ---
  crypto: ^3.0.5
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.18.0
  http: ^1.2.1

  # --- UI ---
  flutter_markdown: ^0.7.3
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  assets:
    - assets/adapters/
