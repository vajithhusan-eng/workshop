<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MockAI — Sandbox Lab</title>
<style>
  :root { --bg:#212121; --fg:#ececec; --dim:#9b9b9b; --accent:#19c37d; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid #303030; display:flex; gap:12px; align-items:center; }
  .brand { font-weight:600; }
  .muted { color:var(--dim); font-size:12px; }
  #thread { flex:1; overflow-y:auto; padding:20px; }
  div[data-message-author-role] { margin:0 0 26px; max-width:760px; }
  div[data-message-author-role="user"] { background:#2a2a2a; padding:12px 16px; border-radius:14px; }
  div[data-message-author-role="assistant"] { padding:4px 2px; line-height:1.6; white-space:pre-wrap; }
  .who { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
  #composerWrap { border-top:1px solid #303030; padding:12px 16px; }
  #composer { width:100%; min-height:52px; max-height:220px; resize:none; background:#303030; color:var(--fg);
              border:1px solid #444; border-radius:14px; padding:12px 14px; font:inherit; outline:none; }
  #composer:focus { border-color:#666; }
  .row { display:flex; justify-content:flex-end; margin-top:8px; gap:8px; }
  button { font:inherit; border-radius:20px; border:1px solid #444; background:transparent; color:var(--fg);
           padding:7px 16px; cursor:pointer; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  button#send-button { background:var(--accent); border-color:var(--accent); color:#08261a; font-weight:600; }
  button#stop-button { background:#d9534f; border-color:#d9534f; color:#fff; display:none; }
  button#profile-button { background:#444; }
  .cursor { display:inline-block; width:8px; background:var(--accent); animation:bl .9s steps(2) infinite; }
  @keyframes bl { 50% { opacity:0; } }
</style>
</head>
<body>

<header>
  <span class="brand">MockAI</span>
  <span class="muted">Sandbox Lab fixture &mdash; not a real AI provider</span>
  <span style="flex:1"></span>
  <!-- The adapter looks for a logged-in marker. This one is present. -->
  <button id="profile-button" data-testid="profile-button" aria-label="Account">VK</button>
</header>

<div id="thread"></div>

<div id="composerWrap">
  <textarea id="composer" data-testid="prompt-textarea" placeholder="Message MockAI"
            aria-label="Message MockAI"></textarea>
  <div class="row">
    <button id="stop-button" data-testid="stop-button" aria-label="Stop streaming">Stop</button>
    <button id="send-button" data-testid="send-button" aria-label="Send message" disabled>Send</button>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Sandbox Lab fixture (upgrade B6).
//
// Deliberately mirrors the real ChatGPT DOM contract that the adapter relies
// on, so the SAME adapter JSON can be validated against it:
//   composer     #prompt-textarea / [data-testid=prompt-textarea]
//   send         button[data-testid=send-button]  (disabled until text present)
//   stop         button[data-testid=stop-button]   (visible only while streaming)
//   assistant    div[data-message-author-role="assistant"]
//   user         div[data-message-author-role="user"]
//   login        button[data-testid=profile-button]
//
// Query knobs, set via ?mode=..., so the adapter can be driven through every
// blocked state without editing this file:
//   mode=ok          normal
//   mode=loggedout   no composer, shows a login wall
//   mode=captcha     shows a challenge page
//   mode=ratelimit   shows a 429 wall
// ---------------------------------------------------------------------------
const _params = new URLSearchParams(location.search);
const MODE = _params.get('mode') || 'ok';
// Per-chunk streaming delay in ms. Tests that need to interrupt mid-answer
// pass ?delay=250 so the race is deterministic instead of machine-dependent.
const DELAY = Number(_params.get('delay') || 25) || 25;
const thread = document.getElementById('thread');
const composer = document.getElementById('composer');
const sendBtn = document.getElementById('send-button');
const stopBtn = document.getElementById('stop-button');

let streaming = false;
// Real generation aborts cooperatively; a timeout alone does not stop an
// await-loop that keeps assigning textContent. Bump this to cancel in-flight.
let abortToken = 0;

// Turns on the blocked-state pages for the login/CAPTCHA/rate-limit checks.
if (MODE !== 'ok') {
  const box = document.createElement('div');
  box.id = 'blocked';
  // Real walls are headings/banners; ours carries data-testid so the kernel's
  // TEXT_TAGS pool can actually match it (a bare <div> is not in TEXT_TAGS).
  box.setAttribute('data-testid', 'blocked-banner');
  box.setAttribute('role', 'status');
  box.textContent = MODE === 'loggedout' ? 'Sign in to continue'
                  : MODE === 'captcha' ? 'Verifying you are human...'
                  : 'Too many requests. Try again later.';
  thread.appendChild(box);
  document.getElementById('composerWrap').style.display = 'none';
}

// A React-style controlled input: a plain `el.value = x` would NOT fire the
// framework's change detection. The adapter must use the native value setter.
function setNativeValue(el, value) {
  const proto = Object.getPrototypeOf(el);
  Object.getOwnPropertyDescriptor(proto, 'value').set.call(el, value);
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
composer.addEventListener('input', () => {
  sendBtn.disabled = composer.value.trim().length === 0;
});

function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.setAttribute('data-message-author-role', role);
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = role;
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text;
  wrap.appendChild(who);
  wrap.appendChild(body);
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
  return body;
}

// Scripted replies so tests are deterministic.
const SCRIPT = [
  'Here is a first answer.\n\nIt has two paragraphs, a numbered list:\n1. alpha\n2. beta\n\nand some `code`.',
  'Second answer, deliberately different in shape so convergence tests can see a low similarity score versus the first.',
];

async function streamInto(node, text) {
  const mine = ++abortToken;
  streaming = true;
  stopBtn.style.display = 'inline-block';
  sendBtn.style.display = 'none';
  for (let i = 0; i < text.length; i += 3) {
    if (mine !== abortToken) return;   // cancelled mid-stream
    await new Promise(r => setTimeout(r, DELAY));
    if (mine !== abortToken) return;
    node.textContent = text.slice(0, i + 3);
    node.appendChild(Object.assign(document.createElement('span'), { className: 'cursor' }));
    thread.scrollTop = thread.scrollHeight;
  }
  if (mine !== abortToken) return;
  node.textContent = text; // cursor span discarded
  streaming = false;
  stopBtn.style.display = 'none';
  sendBtn.style.display = 'inline-block';
  sendBtn.disabled = composer.value.trim().length === 0;
}

sendBtn.addEventListener('click', async () => {
  const text = composer.value;
  if (!text.trim() || streaming) return;
  addMessage('user', text);
  setNativeValue(composer, '');
  sendBtn.disabled = true;
  const body = addMessage('assistant', '');
  await streamInto(body, SCRIPT[SCRIPT.length - 1]);
  SCRIPT.unshift(SCRIPT.pop());
});

stopBtn.addEventListener('click', () => {
  if (!streaming) return;
  abortToken++;            // abort the in-flight stream
  streaming = false;
  stopBtn.style.display = 'none';
  sendBtn.style.display = 'inline-block';
  sendBtn.disabled = false;
  const last = thread.querySelectorAll('div[data-message-author-role="assistant"]');
  last[last.length - 1].querySelector('.body').textContent += ' [stopped by user]';
});

// Expose state so smoke tests can assert without scraping the DOM.
window.__mock = {
  mode: MODE,
  get streaming() { return streaming; },
  get assistantCount() {
    return thread.querySelectorAll('div[data-message-author-role="assistant"]').length;
  },
  get userCount() {
    return thread.querySelectorAll('div[data-message-author-role="user"]').length;
  },
};
</script>
</body>
</html>
