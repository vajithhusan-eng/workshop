include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    missing_return: false
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.hive.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    # linux/** is inert, and that is a fact, not an oversight.
    # `dart analyze` only reads .dart files; linux/ currently contains zero of them
    # (only .cc/.h/CMakeLists/.desktop/.xml), so deleting this line changes the
    # analyze result by exactly nothing -- measured, not assumed.
    # The C++ runner is NOT covered by the Dart analyzer and never was. It is
    # checked separately by tool/cpp_lint.sh (clang++ -fsyntax-only -Wall -Wextra
    # over git-tracked linux/ C++ only, which also skips the gitignored vendored
    # engine headers under linux/flutter/ephemeral/).
    # Keeping this line so a stray future .dart file under linux/ is still opted out
    # deliberately rather than accidentally analysed.
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_slow_async_io
    - avoid_types_as_parameter_names
    - avoid_unnecessary_containers
    - avoid_unused_constructor_parameters
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - constant_identifier_names
    - curly_braces_in_flow_control_structures
    - empty_catches
    - exhaustive_cases
    - no_duplicate_case_values
    - no_logic_in_create_state
    - no_runtimeType_toString
    - prefer_collection_literals
    - prefer_conditional_assignment
    - prefer_final_fields
    - prefer_final_locals
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_iterable_whereType
    - prefer_relative_imports
    - require_trailing_commas
    - sized_box_for_whitespace
    - sort_child_properties_last
    - unnecessary_const
    - unnecessary_null_in_if_null_operators
    - unnecessary_string_interpolations
